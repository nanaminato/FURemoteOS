name: remoteos_client
description: RemoteOS Flutter Client - A remote desktop operating system client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (legacy, being phased out in favour of MVVM stack below)
  flutter_riverpod: ^2.5.1

  # Target MVVM stack (ARCHITECTURE.md § 3 + § 30)
  # get_it 9.x is required by signalr_hub; watch_it 2.4.x is compatible with
  # both get_it 8 and 9, and command_it 9.x requires listen_it 5.x.
  get_it: ^9.2.1
  watch_it: ^2.4.2
  command_it: ^9.5.1
  listen_it: ^5.3.3

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1
  # ASP.NET Core SignalR transport for the remote PTY terminal hub.
  signalr_hub: ^2.1.1
  # VT/xterm renderer for the raw PTY byte stream received from SignalR.
  # Keep the MIT-licensed 5.x line; xterm3 is AGPL-licensed.
  xterm2: ^5.2.0
  # Native desktop open/save dialogs, matching Avalonia StorageProvider.
  # 1.0.3 supports this project's Flutter >=3.19 / Dart >=3.3 baseline.
  file_selector: 1.0.3
  # Native file-list clipboard access for Explorer paste-from-host on desktop.
  pasteboard: ^0.5.0
  # Desktop-friendly code input with syntax highlighting and a line-number gutter.
  flutter_code_editor: ^0.3.5
  highlight: ^0.7.0

  # Local storage
  shared_preferences: ^2.2.3
  # App-support directory for the file-based credential store.
  path_provider: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Window management (desktop)
  window_manager: ^0.5.2
  bitsdojo_window: ^0.1.6

  # Icons
  fluentui_system_icons: ^1.1.245
  font_awesome_flutter: ^11.0.0

  # Internationalization
  easy_localization: ^3.0.7

  # Routing
  go_router: ^18.0.0

  # Utilities
  intl: 0.20.3
  uuid: ^4.4.0
  collection: ^1.18.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/en-US/
    - assets/translations/zh-CN/
    - assets/translations/ja-JP/
    - assets/icons/
    - assets/images/
