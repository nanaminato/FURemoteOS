name: remoteos_client
description: RemoteOS Flutter Client - A remote desktop operating system client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1
  # Native desktop open/save dialogs, matching Avalonia StorageProvider.
  # 1.0.3 supports this project's Flutter >=3.19 / Dart >=3.3 baseline.
  file_selector: 1.0.3
  # Native file-list clipboard access for Explorer paste-from-host on desktop.
  pasteboard: ^0.5.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Window management (desktop)
  window_manager: ^0.5.2
  bitsdojo_window: ^0.1.6

  # Icons
  fluentui_system_icons: ^1.1.245
  font_awesome_flutter: ^11.0.0

  # Internationalization
  easy_localization: ^3.0.7

  # Routing
  go_router: ^18.0.0

  # Utilities
  intl: 0.20.3
  uuid: ^4.4.0
  collection: ^1.18.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/catalog.json
    - assets/translations/shared/
    - assets/translations/login/
    - assets/translations/shell/
    - assets/translations/settings/
    - assets/translations/apps/
    - assets/icons/
    - assets/images/
